<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fusilados Hub</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="fusilados.png">

  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0f1013; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* BLAUWE MELDINGSBANNER BOVENAAN */
    .rent-alert-banner {
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      color: #0f172a;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 800;
      display: none;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
      z-index: 999;
    }
    .rent-alert-text { display: flex; align-items: center; gap: 8px; }
    .close-alert-btn { background: rgba(15, 23, 42, 0.2); border: 1px solid rgba(15, 23, 42, 0.4); color: #0f172a; padding: 4px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .close-alert-btn:hover { background: rgba(15, 23, 42, 0.4); color: #fff; }

    .main-wrapper { display: flex; flex: 1; height: calc(100vh - 40px); overflow: hidden; }

    .sidebar { width: 260px; background-color: #16181d; border-right: 1px solid #232730; display: flex; flex-direction: column; justify-content: space-between; padding: 20px 16px; flex-shrink: 0; }
    
    .brand-section { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #232730; margin-bottom: 20px; cursor: pointer; border-radius: 8px; padding: 8px; transition: background-color 0.2s ease; }
    .brand-section:hover { background-color: #232730; }
    .brand-logo { width: 38px; height: 38px; object-fit: contain; border-radius: 8px; }
    .brand-title { font-size: 1rem; font-weight: 700; color: #ffffff; letter-spacing: 0.03em; }

    .nav-section-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b; margin-bottom: 10px; padding-left: 8px; }
    .nav-list { list-style: none; margin-bottom: 24px; }
    .nav-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 8px; color: #94a3b8; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: all 0.2s ease; margin-bottom: 4px; }
    .nav-item:hover { background-color: #232730; color: #ffffff; }
    .nav-item.active { background-color: #232730; color: #fbbf24; font-weight: 600; }
    .nav-item.active-wiet { background-color: #232730; color: #22c55e; font-weight: 600; }
    .nav-item.active-finance { background-color: #232730; color: #38bdf8; font-weight: 600; }
    .nav-item.active-magazijn { background-color: #232730; color: #a855f7; font-weight: 600; }
    .nav-item .arrow { font-size: 0.75rem; color: #475569; }

    .user-section { padding-top: 16px; border-top: 1px solid #232730; }
    .user-card { background-color: #0f1013; border: 1px solid #232730; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .user-name { font-size: 0.85rem; font-weight: 700; color: #ffffff; margin-bottom: 2px; }
    .user-role { font-size: 0.75rem; color: #fbbf24; font-weight: 600; margin-bottom: 8px; }

    .btn-password { width: 100%; background: transparent; border: 1px solid #232730; color: #94a3b8; padding: 6px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-password:hover { border-color: #fbbf24; color: #fbbf24; }

    .admin-link { display: flex; align-items: center; gap: 8px; padding: 8px 12px; color: #fbbf24; font-size: 0.85rem; font-weight: 600; border-radius: 8px; cursor: pointer; margin-bottom: 8px; transition: background 0.2s; }
    .admin-link:hover { background: rgba(251, 191, 36, 0.1); }

    .btn-logout { width: 100%; background: #ef4444; color: #ffffff; border: none; padding: 8px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }
    .btn-logout:hover { background: #dc2626; }

    .content-area { flex: 1; height: 100%; background-color: #0f1013; }
    iframe { width: 100%; height: 100%; border: none; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal { background: #16181d; border: 1px solid #232730; border-radius: 12px; padding: 24px; width: 320px; }
    .modal h3 { font-size: 1rem; color: #fff; margin-bottom: 16px; }
    .modal input { width: 100%; padding: 10px; background: #0f1013; border: 1px solid #232730; border-radius: 6px; color: #fff; margin-bottom: 16px; outline: none; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .modal-btn { padding: 8px 14px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; border: none; }
    .btn-cancel { background: #232730; color: #94a3b8; }
    .btn-save { background: #fbbf24; color: #0f1013; }
  </style>
</head>
<body>

  <!-- BLAUWE MELDINGSBANNER BOVENAAN VOOR HUUR REMINDERS -->
  <div class="rent-alert-banner" id="rentAlertBanner">
    <div class="rent-alert-text">
      <span>📢</span>
      <span id="rentAlertMsg">Laden van huurstatus...</span>
    </div>
    <button class="close-alert-btn" onclick="closeRentAlert()">✖ Sluiten</button>
  </div>

  <div class="main-wrapper">
    <div class="sidebar">
      <div>
        <div class="brand-section" onclick="openHome()" title="Ga naar Kruispunt">
          <img src="fusilados.png" alt="Fusilados Logo" class="brand-logo">
          <span class="brand-title">Fusilados Hub</span>
        </div>

        <div class="nav-section-title">CATEGORIEËN</div>
        <ul class="nav-list">
          <li class="nav-item active" id="navMinigames" onclick="loadGame(this, 'MinigamesHome.html?v=3')">
            <span>🎮 Minigames Hub</span>
            <span class="arrow">&gt;</span>
          </li>
          <li class="nav-item" id="navWiet" onclick="loadGame(this, 'Wiet_Ingave.html?v=3')">
            <span>🌿 Wiet Ingave Systeem</span>
            <span class="arrow">&gt;</span>
          </li>
          <li class="nav-item" id="navFinancien" onclick="loadGame(this, 'Financien.html?v=2')">
            <span>💰 Bende Financiën</span>
            <span class="arrow">&gt;</span>
          </li>
          <li class="nav-item" id="navMagazijn" onclick="loadGame(this, 'Magazijn.html?v=2')">
            <span>🏬 Magazijn & Huur</span>
            <span class="arrow">&gt;</span>
          </li>
        </ul>
      </div>

      <div class="user-section">
        <div class="user-card">
          <div class="user-name" id="displayUsername">Laden...</div>
          <div class="user-role" id="displayRole">...</div>
          <button class="btn-password" onclick="openPasswordModal()">Wachtwoord Wijzigen</button>
        </div>

        <div class="admin-link" id="adminPanelLink" style="display: none;" onclick="loadGame(null, 'Admin.html')">
          ⚙️ Admin Beheer
        </div>

        <button class="btn-logout" onclick="logout()">Uitloggen</button>
      </div>
    </div>

    <div class="content-area">
      <iframe id="mainFrame" name="mainFrame" src="Home.html?v=3"></iframe>
    </div>
  </div>

  <div class="modal-overlay" id="passwordModal">
    <div class="modal">
      <h3>Nieuw Wachtwoord Instellen</h3>
      <input type="password" id="newPasswordInput" placeholder="Voer nieuw wachtwoord in">
      <div class="modal-actions">
        <button class="modal-btn btn-cancel" onclick="closePasswordModal()">Annuleren</button>
        <button class="modal-btn btn-save" onclick="saveNewPassword()">Opslaan</button>
      </div>
    </div>
  </div>

<script>
  const SUPABASE_URL = "https://suimuvzfrhtqxprzzojy.supabase.co";
  const SUPABASE_KEY = "sb_publishable_LTp-t_e2PX8kF-L-Du1dDw_cY9QNfKJ";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const currentUser = sessionStorage.getItem("currentUser");
  const currentRole = sessionStorage.getItem("currentRole");

  if (!currentUser) {
    window.location.href = "Login.html";
  } else {
    document.getElementById("displayUsername").innerText = currentUser;
    document.getElementById("displayRole").innerText = currentRole || "Gringo";

    if (currentRole === "Opper Gringo") {
      document.getElementById("adminPanelLink").style.display = "flex";
    }
  }

  // CONTROLEER AUTOMATISCH OF ER HUUR VERVALT OVER ≤ 7 DAGEN
  async function checkRentRemindersBanner() {
    const { data } = await _supabase.from('warehouse_reminders').select('*').eq('is_paid', false);
    if (!data || data.length === 0) return;

    const today = new Date();
    today.setHours(0,0,0,0);

    let urgentReminders = [];

    data.forEach(rem => {
      if (rem.due_date) {
        const dueDate = new Date(rem.due_date);
        dueDate.setHours(0,0,0,0);
        const diffDays = Math.ceil((dueDate - today) / (1000 * 60 * 60 * 24));

        if (diffDays <= 7) {
          urgentReminders.push({ title: rem.title, days: diffDays, amount: rem.amount });
        }
      }
    });

    if (urgentReminders.length > 0 && !sessionStorage.getItem("rentAlertClosed")) {
      const banner = document.getElementById("rentAlertBanner");
      const msgElem = document.getElementById("rentAlertMsg");
      
      const first = urgentReminders[0];
      let alertTxt = "";
      if (first.days < 0) {
        alertTxt = `⚠️ **HUUR VERLOPEN!** "${first.title}" is ${Math.abs(first.days)} dag(en) geleden verlopen! (${first.amount ? '€ ' + parseFloat(first.amount).toLocaleString('nl-NL') : ''})`;
      } else if (first.days === 0) {
        alertTxt = `⚠️ **HUUR VERVALT VANDAAG!** "${first.title}" moet vandaag worden betaald/verlengd! (${first.amount ? '€ ' + parseFloat(first.amount).toLocaleString('nl-NL') : ''})`;
      } else {
        alertTxt = `⚠️ **HUUR HERINNERING:** "${first.title}" vervalt over ${first.days} dag(en)! (${first.amount ? '€ ' + parseFloat(first.amount).toLocaleString('nl-NL') : ''})`;
      }

      msgElem.innerText = alertTxt;
      banner.style.display = "flex";
    }
  }

  function closeRentAlert() {
    document.getElementById("rentAlertBanner").style.display = "none";
    sessionStorage.setItem("rentAlertClosed", "true");
  }

  function loadGame(element, url) {
    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active', 'active-wiet', 'active-finance', 'active-magazijn'));
    
    if (element) {
      if (url.includes('Wiet_Ingave')) {
        element.classList.add('active-wiet');
      } else if (url.includes('Financien')) {
        element.classList.add('active-finance');
      } else if (url.includes('Magazijn')) {
        element.classList.add('active-magazijn');
      } else {
        element.classList.add('active');
      }
    }
    
    document.getElementById("mainFrame").src = url;
  }

  function openHome() {
    document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active', 'active-wiet', 'active-finance', 'active-magazijn'));
    document.getElementById("mainFrame").src = "Home.html";
  }

  function openPasswordModal() {
    document.getElementById("passwordModal").style.display = "flex";
  }

  function closePasswordModal() {
    document.getElementById("passwordModal").style.display = "none";
    document.getElementById("newPasswordInput").value = "";
  }

  async function saveNewPassword() {
    const newPassword = document.getElementById("newPasswordInput").value.trim();
    if (!newPassword) {
      alert("Voer een geldig wachtwoord in!");
      return;
    }

    const { error } = await _supabase
      .from('users')
      .update({ password: newPassword })
      .eq('username', currentUser);

    if (error) {
      alert("Fout bij wijzigen wachtwoord: " + error.message);
    } else {
      alert("Wachtwoord succesvol gewijzigd!");
      closePasswordModal();
    }
  }

  function logout() {
    sessionStorage.clear();
    window.location.href = "Login.html";
  }

  checkRentRemindersBanner();
</script>

</body>
</html>
