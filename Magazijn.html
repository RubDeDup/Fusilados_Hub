<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fusilados Hub - Magazijn</title>
  
  <link rel="icon" type="image/png" href="fusilados.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0f1013; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; padding: 40px 24px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 1100px; }
    
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .section-title { font-size: 1.2rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #a855f7; display: flex; align-items: center; gap: 8px; }
    .back-btn { background: #16181d; border: 1px solid #232730; color: #94a3b8; padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .back-btn:hover { color: #fbbf24; border-color: #fbbf24; }

    .card { background-color: #16181d; border: 1px solid #232730; border-radius: 14px; padding: 28px; margin-bottom: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    .card h2 { font-size: 1.2rem; color: #ffffff; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }

    .pin-display-box { background: #0f1013; border: 2px dashed #a855f7; border-radius: 12px; padding: 28px; text-align: center; margin-bottom: 24px; }
    .pin-title { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; margin-bottom: 8px; }
    .pin-code { font-size: 3.5rem; font-weight: 900; letter-spacing: 0.25em; color: #38bdf8; text-shadow: 0 0 20px rgba(56, 189, 248, 0.4); margin: 10px 0; }
    .pin-month { font-size: 0.85rem; color: #64748b; }

    .form-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 12px; align-items: end; margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.75rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 6px; }
    .form-group input, .form-group select { width: 100%; padding: 10px 12px; background: #0f1013; border: 1px solid #232730; border-radius: 8px; color: #fff; font-size: 0.9rem; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: #a855f7; }

    .btn-add { padding: 10px 20px; background: #a855f7; color: #ffffff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; height: 42px; }
    .btn-add:hover { background: #9333ea; }

    .reminder-item { display: flex; justify-content: space-between; align-items: center; background: #0f1013; border: 1px solid #232730; border-radius: 10px; padding: 16px 20px; margin-bottom: 12px; }
    .reminder-item.warning { border-color: #38bdf8; background: rgba(56, 189, 248, 0.05); }
    .reminder-item.expired { border-color: #ef4444; background: rgba(239, 68, 68, 0.05); }
    .reminder-item.paid { opacity: 0.4; text-decoration: line-through; }

    .reminder-info { display: flex; flex-direction: column; gap: 6px; }
    .reminder-title { font-size: 1rem; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 8px; }
    .reminder-meta { font-size: 0.8rem; color: #94a3b8; }
    .badge-days { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; display: inline-block; }
    .badge-ok { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid #22c55e; }
    .badge-warn { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid #38bdf8; }
    .badge-exp { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

    .reminder-actions { display: flex; gap: 8px; align-items: center; }

    .btn-extend { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid #a855f7; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
    .btn-extend:hover { background: #a855f7; color: #fff; }

    .btn-check { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid #22c55e; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
    .btn-check:hover { background: #22c55e; color: #0f1013; }

    .btn-delete { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #ef4444; padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
    .btn-delete:hover { background: #ef4444; color: #fff; }

    .watermark { position: fixed; bottom: 15px; right: 20px; font-size: 0.75rem; color: #475569; pointer-events: none; }
  </style>
</head>
<body>

  <div class="container">

    <div class="header-bar">
      <div class="section-title">🏬 MAGAZIJN & HUUR</div>
      <button class="back-btn" onclick="goToKruispunt()">← Terug naar Kruispunt</button>
    </div>

    <!-- PINCODE DISPLAY -->
    <div class="pin-display-box">
      <div class="pin-title">🔑 MAANDELIJKSE MAGAZIJN PINCODE</div>
      <div class="pin-code" id="warehousePinCode">----</div>
      <div class="pin-month" id="warehousePinMonth">Laden van code...</div>
    </div>

    <!-- HUUR REMINDERS CARD -->
    <div class="card">
      <h2>⏰ Huur-Afteller & Reminders</h2>

      <!-- FORMULIER VOOR AUTOMATISCHE HUUR ADDEN -->
      <form onsubmit="addReminder(event)" class="form-grid">
        <div class="form-group">
          <label>Magazijn / Omschrijving</label>
          <input type="text" id="remTitle" required placeholder="bijv. Hoofdmagazijn Zuid">
        </div>
        <div class="form-group">
          <label>Huurprijs (€)</label>
          <input type="number" id="remAmount" min="0" placeholder="bijv. 150000">
        </div>
        <div class="form-group">
          <label>Startdatum</label>
          <input type="date" id="remStartDate" required>
        </div>
        <div class="form-group">
          <label>Huurperiode</label>
          <select id="remPeriod">
            <option value="28">28 Dagen (Maand)</option>
            <option value="7">7 Dagen (Week)</option>
          </select>
        </div>
        <button type="submit" class="btn-add">+ Huur Instellen</button>
      </form>

      <!-- LIJST MET GEAUTOMATISEERDE REMINDERS -->
      <div id="remindersList">
        <p style="color: #64748b; text-align: center; font-style: italic;">Laden van herinneringen...</p>
      </div>
    </div>

  </div>

  <div class="watermark">Created by RubDeDup</div>

<script>
  const SUPABASE_URL = "https://suimuvzfrhtqxprzzojy.supabase.co";
  const SUPABASE_KEY = "sb_publishable_LTp-t_e2PX8kF-L-Du1dDw_cY9QNfKJ";
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const currentUser = sessionStorage.getItem("currentUser") || "Onbekend";

  // ZET STANDAARD DATUM OP VANDAAG
  document.getElementById("remStartDate").valueAsDate = new Date();

  // 1. MAANDELIJKSE AUTOMATISCHE 4-CIJFERIGE PINCODE GENERATOR
  async function loadWarehouseData() {
    const now = new Date();
    const currentMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    const monthNames = ["Januari", "Februari", "Maart", "April", "Mei", "Juni", "Juli", "Augustus", "September", "Oktober", "November", "December"];
    const monthLabel = `${monthNames[now.getMonth()]} ${now.getFullYear()}`;

    document.getElementById("warehousePinMonth").innerText = `Geldig voor de maand: ${monthLabel}`;

    const { data, error } = await _supabase
      .from('warehouse_data')
      .select('*')
      .eq('month_year', currentMonthKey)
      .single();

    if (data && data.pincode) {
      document.getElementById("warehousePinCode").innerText = data.pincode;
    } else {
      const newPin = Math.floor(1000 + Math.random() * 9000).toString();

      const { error: insertErr } = await _supabase.from('warehouse_data').insert([{
        month_year: currentMonthKey,
        pincode: newPin
      }]);

      if (!insertErr) {
        document.getElementById("warehousePinCode").innerText = newPin;
      } else {
        document.getElementById("warehousePinCode").innerText = "FOUT";
      }
    }
  }

  // 2. AUTOMATISCHE AFTELLER & REMINDERS
  async function loadReminders() {
    const container = document.getElementById("remindersList");
    const { data, error } = await _supabase
      .from('warehouse_reminders')
      .select('*')
      .order('is_paid', { ascending: true })
      .order('due_date', { ascending: true });

    if (error || !data) {
      container.innerHTML = "<p style='color:#ef4444;'>Fout bij het laden van herinneringen!</p>";
      return;
    }

    if (data.length === 0) {
      container.innerHTML = "<p style='color:#64748b; text-align:center; padding:12px;'>Geen actieve magazijnhuur ingesteld.</p>";
      return;
    }

    const today = new Date();
    today.setHours(0,0,0,0);

    container.innerHTML = "";
    data.forEach(rem => {
      const dueDate = rem.due_date ? new Date(rem.due_date) : new Date();
      dueDate.setHours(0,0,0,0);

      const diffTime = dueDate - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      let badgeClass = "badge-ok";
      let statusTxt = `${diffDays} dagen over`;
      let itemClass = "";

      if (diffDays <= 7 && diffDays >= 0) {
        badgeClass = "badge-warn";
        itemClass = "warning";
        statusTxt = `⚠️ Vervalt over ${diffDays} dag(en)!`;
      } else if (diffDays < 0) {
        badgeClass = "badge-exp";
        itemClass = "expired";
        statusTxt = `🚨 VERLOPEN (${Math.abs(diffDays)} dagen geleden)!`;
      }

      const item = document.createElement("div");
      item.className = `reminder-item ${itemClass} ${rem.is_paid ? 'paid' : ''}`;

      const amountFormatted = rem.amount ? `€ ${parseFloat(rem.amount).toLocaleString('nl-NL')}` : 'Geen bedrag';
      const dateFormatted = dueDate.toLocaleDateString('nl-NL');

      item.innerHTML = `
        <div class="reminder-info">
          <div class="reminder-title">
            <span>${rem.title}</span>
            <span class="badge-days ${badgeClass}">${statusTxt}</span>
          </div>
          <div class="reminder-meta">💰 ${amountFormatted} | 📅 Vervaldatum: ${dateFormatted} | ⏱️ Periode: ${rem.period_days || 28} Dagen | 👤 Door: ${rem.created_by || 'Onbekend'}</div>
        </div>
        <div class="reminder-actions">
          <button class="btn-extend" onclick="extendRent(${rem.id}, '${rem.due_date}', ${rem.period_days || 28})">🔄 Verlengen</button>
          ${!rem.is_paid ? `<button class="btn-check" onclick="togglePaid(${rem.id}, true)">✔ Afvinken</button>` : `<button class="btn-check" style="border-color:#94a3b8; color:#94a3b8;" onclick="togglePaid(${rem.id}, false)">↩ Herstellen</button>`}
          <button class="btn-delete" onclick="deleteReminder(${rem.id})">🗑️</button>
        </div>
      `;
      container.appendChild(item);
    });
  }

  // 3. NIEUWE HUUR TOEVOEGEN MET AUTOMATISCHE DATUMBEREKENING
  async function addReminder(e) {
    e.preventDefault();
    const title = document.getElementById("remTitle").value.trim();
    const amount = parseFloat(document.getElementById("remAmount").value) || null;
    const startDateStr = document.getElementById("remStartDate").value;
    const periodDays = parseInt(document.getElementById("remPeriod").value);

    const startDate = new Date(startDateStr);
    const dueDate = new Date(startDate);
    dueDate.setDate(dueDate.getDate() + periodDays);

    const due_date = dueDate.toISOString().split('T')[0];

    const { error } = await _supabase.from('warehouse_reminders').insert([{
      title,
      amount,
      start_date: startDateStr,
      due_date,
      period_days: periodDays,
      created_by: currentUser
    }]);

    if (error) {
      alert("Fout bij instellen: " + error.message);
      return;
    }

    document.getElementById("remTitle").value = "";
    document.getElementById("remAmount").value = "";

    loadReminders();
    if (window.parent && window.parent.checkRentRemindersBanner) {
      window.parent.checkRentRemindersBanner();
    }
  }

  // 4. HUUR VERLENGEN MET 28 OF 7 DAGEN
  async function extendRent(id, currentDueDateStr, periodDays) {
    const currentDueDate = new Date(currentDueDateStr);
    const newDueDate = new Date(currentDueDate);
    newDueDate.setDate(newDueDate.getDate() + periodDays);

    const newDueDateStr = newDueDate.toISOString().split('T')[0];

    const { error } = await _supabase.from('warehouse_reminders').update({
      due_date: newDueDateStr,
      is_paid: false
    }).eq('id', id);

    if (error) {
      alert("Fout bij verlengen: " + error.message);
      return;
    }

    alert(`Huur succesvol verlengd met ${periodDays} dagen! Nieuwe vervaldatum: ${newDueDate.toLocaleDateString('nl-NL')}`);
    loadReminders();
    if (window.parent && window.parent.checkRentRemindersBanner) {
      window.parent.checkRentRemindersBanner();
    }
  }

  // 5. STATUS AFVINKEN
  async function togglePaid(id, status) {
    await _supabase.from('warehouse_reminders').update({ is_paid: status }).eq('id', id);
    loadReminders();
  }

  // 6. VERWIJDEREN
  async function deleteReminder(id) {
    if (confirm("Weet je zeker dat je deze magazijnhuur wilt verwijderen?")) {
      await _supabase.from('warehouse_reminders').delete().eq('id', id);
      loadReminders();
    }
  }

  function goToKruispunt() {
    if (window.parent && window.parent.openHome) {
      window.parent.openHome();
    } else {
      window.location.href = 'Home.html';
    }
  }

  loadWarehouseData();
  loadReminders();
</script>

</body>
</html>
